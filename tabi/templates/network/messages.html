{% extends "network/layout.html" %}{% block body %}<h1>Your conversations</h1><form method="post" class="profile-card">{% csrf_token %}<label>Start a conversation with user ID <input type="number" name="user_id" required></label><button class="btn btn-primary">Start</button></form>{% for thread in conversations %}<p class="message-card"><a href="{% url 'conversation' thread.id %}">Conversation {{ thread.id }}</a></p>{% empty %}<p>No conversations yet.</p>{% endfor %}{% endblock %}
