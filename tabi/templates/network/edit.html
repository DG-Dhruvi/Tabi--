{% extends "network/layout.html" %}

{% block body %}
    {% if user.is_authenticated %}

        <div class="new-post">
            <h3>Edit Post</h3>
            <form action="{% url 'editPost' %}" method="post">
                {% csrf_token %}
                <textarea name="content" row="4" cols="100">{{content}}</textarea>
                <div class='row'><input type="submit" value="Save" class="btn btn-primary"/></div>
            </form>
        </div>

    {% endif %}
{% endblock %}
