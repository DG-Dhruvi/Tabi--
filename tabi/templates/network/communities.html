{% extends "network/layout.html" %}{% block body %}<h1>Communities</h1><form method="post" class="profile-card">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Create community</button></form>{% for community in communities %}<article class="community-card"><h3><a href="{% url 'community' community.slug %}">{{ community.name }}</a></h3><p>{{ community.description }}</p></article>{% empty %}<p>Communities are small spaces to explore shared interests.</p>{% endfor %}{% endblock %}
