{% extends "network/layout.html" %}{% block body %}<h1>Conversation</h1><section id="thread-messages" data-poll-url="{% url 'poll_messages' conversation.id %}" data-last-id="0">{% for item in messages %}<p>{% if item.sender == user %}You{% else %}{{ item.sender.username }}{% endif %}: {{ item.content }}</p>{% endfor %}</section><form method="post" class="profile-card">{% csrf_token %}<textarea name="content" maxlength="2000" required></textarea><button class="btn btn-primary">Send</button></form>{% endblock %}
