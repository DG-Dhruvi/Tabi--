{% extends "tabi/layout.html" %}{% block title %}Edit post · Tabi{% endblock %}{% block body %}<section class="page-heading"><p class="eyebrow">YOUR WORDS, YOUR PACE</p><h1>Edit post</h1></section><form action="{% url 'edit_post_page' post.id %}" method="post" class="form-card">{% csrf_token %}{% if error %}<div class="form-alert" role="alert">{{ error }}</div>{% endif %}<div class="form-field"><label for="content">Post text</label><textarea id="content" name="content" maxlength="500" required>{{ post.content }}</textarea></div><div class="form-actions"><a class="btn btn-light" href="{% url 'profile' user.id %}">Cancel</a><button class="btn btn-primary" type="submit">Save changes</button></div></form>{% endblock %}
